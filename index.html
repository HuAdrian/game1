<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d8c39a">
  <title>Case Files</title>
  <meta name="description" content="An IELTS practice game disguised as detective work.">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <div id="app">
    <header id="bar" hidden>
      <div class="bar-title">
        <span id="bar-case"></span>
        <b id="bar-scene"></b>
      </div>
      <button id="clock" type="button" aria-label="Case clock">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 3.2v1.6M12 19.2v1.6M3.2 12h1.6M19.200 12h1.6"/><line id="hand-h" x1="12" y1="12" x2="12" y2="7.200"/><line id="hand-m" x1="12" y1="12" x2="12" y2="4.600"/><circle class="hub" cx="12" cy="12" r="1.100"/></svg>
        <span><b id="clock-time"></b><small id="clock-sub"></small></span>
      </button>
      <button id="btn-hint" type="button"><span>Ask Sam</span><span id="hint-pips"></span></button>
      <button id="btn-notebook" type="button" aria-label="Notebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3v18M3 7h3M3 12h3M3 17h3M10 8h5M10 12h5"/></svg>
      </button>
      <div id="progress" aria-hidden="true"></div>
    </header>
    <div id="place" aria-hidden="true"><div id="place-art"></div></div>
    <div id="prop"></div>
    <main id="stage"></main>
    <footer id="tray" hidden></footer>
    <div id="dialogue" hidden></div>
    <div id="sheet" hidden></div>
    <div id="wipe" hidden></div>
    <div id="stamp-layer" aria-live="polite"></div>
    <div id="toasts" aria-live="polite"></div>
  </div>
  <noscript>Case Files needs JavaScript to run.</noscript>

  <script src="js/engine.js?v=2"></script>
  <script src="js/feel.js?v=2"></script>
  <script src="js/scenes.js?v=2"></script>
  <!-- Each case is one data file. Add new cases here.
       Raise the ?v= number on every file when you publish a change, so phones do not keep old copies. -->
  <script src="cases/missing-violinist.js?v=2"></script>
  <script>CaseFiles.boot();</script>
</body>
</html>
