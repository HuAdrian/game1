html/head_include="<meta name=\"theme-color\" content=\"#d8c39a\">
<style>
  @font-face { font-family: \"CF Hand\"; src: url(\"godot/assets/fonts/Kalam-Regular.ttf\"); font-display: swap; }
  html, body { background: #d8c39a; overscroll-behavior: none; }
  /* Real text boxes laid over the canvas, so the phone keyboard opens the normal way. */
  .cf-input { position: fixed; z-index: 5; box-sizing: border-box; margin: 0; padding: 0 4px; border: 0; border-radius: 0; outline: none;
    background: transparent; color: #23447c; font-family: \"CF Hand\", \"Bradley Hand\", \"Segoe Print\", cursive; -webkit-appearance: none; appearance: none; }
  .cf-input:focus { background: rgba(255, 255, 255, .75); }
  .cf-input.caps { text-transform: uppercase; font-family: \"Courier New\", monospace; font-weight: 700; color: #1c2530; }
</style>
<script>
/* Bridge between the Godot game and the browser: speech for calls, typed answers, clipboard. */
(function () {
  'use strict';
  var synth = window.speechSynthesis, hasSpeech = !!(synth && window.SpeechSynthesisUtterance), voices = [], keep = [];
  function loadVoices() { try { voices = synth.getVoices() || []; } catch (e) {} }
  if (hasSpeech) { loadVoices(); if (synth.addEventListener) synth.addEventListener('voiceschanged', loadVoices); }
  // Phones only allow speech that was first started inside a tap, so unlock it on the first touch.
  var unlocked = false;
  function unlock() {
    if (unlocked || !hasSpeech) return; unlocked = true;
    try { var u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } catch (e) {}
  }
  window.addEventListener('pointerdown', unlock, true); window.addEventListener('touchend', unlock, true);

  function pick(prefer) {
    var gb = voices.filter(function (v) { return /^en[-_]GB/i.test(v.lang); });
    var pool = gb.length ? gb : voices.filter(function (v) { return /^en/i.test(v.lang); });
    if (!pool.length) return null;
    var fem = /female|kate|serena|martha|hazel|susan|libby|sonia|maisie|stephanie|fiona|moira|amy|emma/i;
    var mal = /\\bmale|daniel|arthur|george|oliver|ryan|thomas|malcolm|gordon|brian/i;
    var want = prefer === 'male' ? pool.filter(function (v) { return mal.test(v.name) && !/female/i.test(v.name); }) : pool.filter(function (v) { return fem.test(v.name); });
    if (want.length) return want[0];
    return prefer === 'male' && pool.length > 1 ? pool[1] : pool[0];
  }

  window.cfSpeech = {
    state: 'idle', line: 0,
    /** Speaks the lines in order with a British voice. state ends as \"done\" (audio played) or \"fail\" (no voice). */
    speak: function (json) {
      var o = JSON.parse(json), self = this, lines = o.lines, done = false, started = false, t0 = Date.now(), w1, w2;
      var chars = lines.join(' ').length;
      self.state = 'playing'; self.line = 0;
      function finish(ok) { if (done) return; done = true; clearTimeout(w1); clearTimeout(w2); keep = []; self.state = ok ? 'done' : 'fail'; }
      if (!hasSpeech) { finish(false); return; }
      try {
        if (synth.speaking || synth.pending) synth.cancel();
        if (synth.paused) synth.resume();
        var voice = pick(o.prefer);
        keep = lines.map(function (text, i) {
          var u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-GB'; if (voice) u.voice = voice; u.rate = o.rate || 0.95; u.pitch = o.pitch || 1;
          u.onstart = function () { started = true; self.line = i; };
          u.onerror = function (e) { if (e.error === 'interrupted' || e.error === 'canceled') finish(started); else finish(false); };
          if (i === lines.length - 1) u.onend = function () { finish(Date.now() - t0 > Math.min(1500, chars * 8)); };
          return u;
        });
        keep.forEach(function (u) { synth.speak(u); });
      } catch (e) { finish(false); return; }
      w1 = setTimeout(function () { if (!started) { try { synth.cancel(); } catch (e) {} finish(false); } }, 5000);
      w2 = setTimeout(function () { finish(true); }, chars * 120 + 15000);
    },
    stop: function () { try { if (hasSpeech) synth.cancel(); } catch (e) {} this.state = 'idle'; }
  };

  var inputs = {};
  window.cfInput = {
    /** Places one text box per field over the canvas. Rects are fractions of the canvas. Returns the current values. */
    sync: function (json) {
      var list = JSON.parse(json), canvas = document.getElementById('canvas') || document.querySelector('canvas');
      var r = canvas.getBoundingClientRect(), seen = {}, out = {};
      list.forEach(function (f) {
        var el = inputs[f.id];
        if (!el) {
          el = document.createElement('input');
          el.type = 'text'; el.className = 'cf-input' + (f.caps ? ' caps' : ''); el.id = 'cf-' + f.id;
          el.autocomplete = 'off'; el.spellcheck = false; el.setAttribute('autocapitalize', f.caps ? 'characters' : 'off'); el.setAttribute('autocorrect', 'off');
          el.setAttribute('aria-label', f.label || f.id); el.setAttribute('enterkeyhint', 'done');
          el.value = f.value || '';
          el.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.blur(); e.stopPropagation(); });
          ['keyup', 'keypress', 'pointerdown', 'mousedown', 'touchstart'].forEach(function (t) { el.addEventListener(t, function (e) { e.stopPropagation(); }); });
          document.body.appendChild(el); inputs[f.id] = el;
        }
        el.style.left = (r.left + f.x * r.width) + 'px'; el.style.top = (r.top + f.y * r.height) + 'px';
        el.style.width = (f.w * r.width) + 'px'; el.style.height = (f.h * r.height) + 'px';
        el.style.fontSize = (f.size * r.height) + 'px';
        el.style.display = f.show ? '' : 'none';
        el.disabled = !!f.locked;
        if (f.force != null && el.value !== f.force) el.value = f.force;
        seen[f.id] = true; out[f.id] = el.value;
      });
      Object.keys(inputs).forEach(function (id) { if (!seen[id]) { inputs[id].remove(); delete inputs[id]; } });
      return JSON.stringify(out);
    }
  };

  window.cfCopy = function (text) { try { navigator.clipboard.writeText(text); return true; } catch (e) { return false; } };
  window.cfTestMode = /[?&]cftest/.test(location.search);
})();
</script>
